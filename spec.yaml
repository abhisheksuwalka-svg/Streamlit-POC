spec:
  containers:
    - name: arr-dashboard
      image: /ARR_WAREHOUSE/ARR_ANALYTICS/ARR_DASHBOARD_REPO/arr-dashboard:latest
      env:
        SNOWFLAKE_WAREHOUSE: AI_WH
      resources:
        requests:
          memory: 512M
          cpu: 0.5
        limits:
          memory: 1G
          cpu: 1
  endpoints:
    - name: dashboard
      port: 8501
      public: true
